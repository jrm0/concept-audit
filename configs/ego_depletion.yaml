# configs/ego_depletion.yaml — everything that used to be a literal in
# 16/17/18/20/22/23/23b, in one place. One file per concept.
#
# Run any lineage script against it with:  python3 18_lineage_analysis.py --config configs/ego_depletion.yaml
# (this file is the default, so --config may be omitted for ego depletion.)

concept: ego depletion          # focal term, canonical form (hyphen/space-insensitive)
slug: ego_depletion             # used for results/<slug>/ and manifest names

# --- inputs -----------------------------------------------------------------
family_csv: families/ego_depletion_family.csv
ris_root: "data/ebsco exports"                     # searched recursively for *.ris
family_works_glob: "data/family/ego_depletion*works.jsonl"   # OpenAlex-derived, optional
docs_path: data/family/lineage_docs.jsonl          # written by 16, read by 17/18/20/22/23
# emb_dir names the EMBEDDING RUN. data/lineage_emb = the Aug-13 run, capped
# at 250 docs per (term, period). data/lineage_emb_full = uncapped (every
# document), the default from 2026-09-08. Keep both: the two-cap sensitivity
# check in the methods paper compares them. Point emb_dir at the old folder
# (and set embedding.cap_per_term_period: 250) to reproduce the capped run.
emb_dir: data/lineage_emb_full                     # written by 17, read by 18/20/21/22/23
citations_cache: data/citations/openalex_refs.jsonl

# --- outputs ----------------------------------------------------------------
# results dir is named by embedding run: results/ego_depletion = the Aug-13
# 250-cap shards (data/lineage_emb); results/ego_depletion_full = uncapped.
results_dir: results/ego_depletion_full            # every script writes here + a manifest

# --- corpus specification ---------------------------------------------------
# Principle 10: the log is the methods section. Every export 16 ingests must
# match a `sources` entry (by filename glob); unlisted exports are refused.
# Reconstructed 2026-09-08 from myEBSCO saved searches + RIS DB tags.
corpus:
  platform: EBSCOhost (BU ezproxy)
  exported: 2026-08-11 to 2026-08-13
  # Retrieval was BROADER than title/abstract: all three EBSCO expanders were
  # on. 16 then keeps only documents whose title+abstract actually contains a
  # family term — that filter is the operative bound, and it is applied
  # uniformly across sources. Report both.
  expanders: [apply related words, also search within full text, apply equivalent subjects]
  limiters: [peer reviewed]
  language_filter: none
  document_type_filter: none      # dissertations/chapters/books pass; labeled as strata below
  queries:
    focal: >-
      "ego depletion" OR "ego-depletion" OR "self-regulatory depletion" OR
      "self-control depletion" OR "depletion effect" OR "strength model of self-control"
    family: >-
      ("ego depletion" OR "ego-depletion" OR "self-regulatory depletion" OR
      "self-control depletion" OR "depletion effect" OR "strength model of self-control"
      OR "willpower" OR "self-control" OR "self-regulation")
      AND NOT ("emotion regulation" OR "self-regulated learning")
  # exclusions are limits on what the map can show (principle 3)
  exclusions:
    - {term: "emotion regulation", why: "largest non-family sense (affect science); would dominate ancestors"}
    - {term: "self-regulated learning", why: "Zimmerman SRL, education; metacognitive not resource-based"}
    - {habitat: "Philosopher's Index", why: "planned (akrasia lineage) but not pulled"}
    - {habitat: "PsycTests / PsycBooks", why: "planned (operationalization evidence) but not pulled"}
    - {habitat: "popular usage (news, Google Books)", why: "not sampled; horizontal creep into lay usage is invisible here"}
  # Register strata by RIS TY tag (principle 7). Analyses pool only within a stratum
  # unless explicitly stated; 16 labels every document with its stratum.
  strata:
    journal: [JOUR, ABST, CONF, CASE, GEN]
    thesis: [THES]
    book: [CHAP, BOOK, EBOOK, EDBOOK]
  sources:
    - id: psyc_focal
      files: ["data/ebsco exports/cedd0a9a-*.ris"]
      databases: [APA PsycArticles, APA PsycInfo]
      query: focal
      dates: all
      role: focal
      question: "the daughter lineage — every peer-reviewed use of the coined terms"
      n_records: 2200
      n_saved_search: 2296
    - id: psyc_family_all
      files: ["data/ebsco exports/ea388b9b-*.ris"]
      databases: [APA PsycArticles, APA PsycInfo]
      query: family
      dates: all
      role: family
      question: "first full-family pull (superseded by the date-sliced psyc_family_* below; kept, dedupes against them)"
      n_records: 8009
      n_saved_search: 8230
    - id: psyc_family_1975_1999
      files: ["data/ebsco exports/Psyc_SC-SR-WP/SC-SR-WP_1975-1999.ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 1975-1999
      role: ancestor
      question: "parent population BEFORE the 1998 coinage (principle 2) — no birth is visible without it"
      n_records: 5219
    - id: psyc_family_2000_2015
      files: ["data/ebsco exports/Psyc_SC-SR-WP/SC-SR-WP_2000-2015.ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 2000-2015
      role: ancestor
      question: "parent lineage after the split — divergence needs both lineages measured"
      n_records: 12598
    - id: psyc_family_2015_2025
      files: ["data/ebsco exports/Psyc_SC-SR-WP/SC-SR-WP_2015-2025.ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 2015-2025
      role: ancestor
      question: "parent lineage through the correction era"
      n_records: 14615
    - id: business
      files: ["data/ebsco exports/Business_SC-SR-WP.ris"]
      databases: [Business Source Complete, "Business Abstracts with Full Text (H.W. Wilson)", Business Source Alumni Edition, "Applied Science & Business Periodicals Retrospective: 1913-1983 (H.W. Wilson)"]
      query: family
      dates: all
      role: habitat
      hypothesis: "work/organizational — the venue category where the migration finding lives"
      question: "did the concept move into applied management/OB literatures, and did the correction follow?"
      n_records: 8671
    - id: education
      files: ["data/ebsco exports/education_SC-SR-WP.ris"]
      databases: ["Education Full Text (H.W. Wilson)"]
      query: family
      dates: all
      role: habitat
      hypothesis: "self-regulation → self-regulated learning (Zimmerman); metacognitive, not resource-based"
      n_records: 11445
    - id: health
      files: ["data/ebsco exports/health_SC-SR-WP.ris"]
      databases: [CINAHL, "Dentistry & Oral Sciences Source"]
      query: family
      dates: all
      role: habitat
      hypothesis: "health behavior change — applied/clinical sense of self-regulation"
      n_records: 9147
    - id: crime_socialwork
      files: ["data/ebsco exports/crime-socialwork_SC-SR-WP.ris"]
      databases: [SocINDEX with Full Text, Criminal Justice Abstracts, Social Work Abstracts]
      query: family
      dates: all
      role: habitat
      hypothesis: "Gottfredson & Hirschi trait self-control (crime) — the sharpest cross-field contrast"
      n_records: 8752
    - id: econ
      files: ["data/ebsco exports/econ_SC-SR-WP.ris"]
      databases: [EconLit]
      query: family
      dates: all
      role: habitat
      hypothesis: "intertemporal choice / present bias — formalized operationalization"
      n_records: 1851
      note: "DOI coverage 23% — dedupe relies on normalized title here"
  # Exports under ris_root that are NOT part of this corpus. 16 skips them
  # (and says so); any other unlisted export is an error.
  ignore:
    - {files: "data/ebsco exports/constructs/**", why: "Paper-2 OSC-99 construct exports (osc_coding pipeline), not the ego-depletion family"}
  # Audit thresholds (principle 8): 16 warns if a source falls below these.
  audit:
    min_abstract_share: 0.85
    warn_if_dedupe_share_above: 0.45

# --- corpus / periods -------------------------------------------------------
periods:
  year_min: 1975
  year_max: 2025
  width: 5

# Generic method words embedded from the same abstracts — the drift null
# (Dubossarsky) and the anisotropy-centering reference. Same for every concept.
control_terms: [participants, results, significant, measure]

# --- embedding (17, 20) -----------------------------------------------------
embedding:
  model: allenai/scibert_scivocab_uncased
  max_length: 256
  max_sent_per_doc: 3
  cap_per_term_period: null   # null = embed EVERY document (2026-09-08); a number restores a cap
  control_cap: 300            # control terms only need a stable reference centroid
  seed: 42

# --- lineage analysis (18, 21) ---------------------------------------------
analysis:
  min_n: 15              # min docs for a period centroid
  cluster_min_n: 60      # min docs to attempt within-period clustering (a floor, not a ceiling)
  max_k: 4
  n_sample_titles: 10
  seed: 42
  # Matched-n resampling for CROSS-period statistics (drift, cross-term
  # distances, their noise floors): each comparison is made at
  # n_eq = min(n_a, n_b, equalize_n), repeated equalize_reps times; mean ± sd
  # reported with the full-data estimate. Within-period description uses all
  # documents.
  equalize_n: 250
  equalize_reps: 100

# Dated events printed against the curves and drawn as vertical rules.
events:
  1998: "coinage (Baumeister et al. 1998)"
  2010: "supportive meta-analysis (Hagger et al.)"
  2014: "critical re-analysis (Carter & McCullough)"
  2016: "Registered Replication Report (Hagger et al.)"
  2021: "second RRR (Vohs et al.)"
event_short_labels:      # for figure rules (22)
  1998: coinage
  2010: meta-analysis
  2014: re-analysis
  2016: RRR
  2021: "RRR 2"

# Cross-term distance series to print in the 18 report and plot in fig 4B.
key_pairs:
  - [ego depletion, self control]
  - [ego depletion, self regulation]
  - [ego depletion, willpower]
  - [self control, self regulation]
  - [ego depletion, executive function]
  - [ego depletion, delay of gratification]

# --- figures (22) -----------------------------------------------------------
figures:
  trajectory_terms: [ego depletion, self control, self regulation, willpower,
                     executive function, strength model, delay of gratification]
  trajectory_min_docs: 60
  drift_terms:           # term, colour  (fig 4A)
    - [strength model, crimson]
    - [ego depletion, navy]
    - [self control, "0.45"]
    - [self regulation, "0.6"]
    - [willpower, "0.75"]
  distance_pairs:        # fig 4B
    - [ego depletion, self control, navy]
    - [ego depletion, willpower, darkorange]
    - [ego depletion, executive function, seagreen]
    - [self control, self regulation, crimson]
  migration_baseline_category: work/org
  # Free-text subtitles. These were previously hard-typed result numbers in
  # the script; they are annotations, NOT computed here (gap analysis item 7:
  # the migration permutation test still needs to move into code).
  annotations:
    ridgeline: "One mode per period (dip test p = 0.71–0.99); triangles mark period means"
    migration: "work/org share 12.0% (2015-19) → 24.8% (2020-24), permutation p = 0.0001; corpus baseline flat"
    trajectory: "'ego depletion' (bold) starts beside its ancestors, moves away through 2015-19, then turns back"
    propagation: "The concept travels; the correction doesn't — applied venues cite the coinage like the home field, the critiques at a fraction of its rate"

# --- venue categories (22, 23, 23b) — journal-name regexes ------------------
# Order matters: first match wins. Anything unmatched -> core_label.
venue_categories:
  - name: work/org
    pattern: "organi[sz]ation|management|business|occupational|vocational|work|employ|leader|market|consumer|account|tourism|hospitality|industrial|labor|labour|applied psycholog|personnel|human resource|human performance|ergonomic"
  - name: health/med
    pattern: "health|medic|nurs|clinical|addict|obes|diet|patient|psychosomat|prevent"
  - name: education
    pattern: "educat|school|teach|learn|student|academic|curricul"
  - name: sport
    pattern: "sport|exercise|athlet|kinesio|physical activity"
  - name: crime/social
    pattern: "crimin|delinq|justice|offend|social work|deviant|violence"
core_label: core/other psych

# --- citation layer (23, 23b) ----------------------------------------------
citation:
  mailto: jrmorgan3@gmail.com     # OpenAlex polite pool
  batch: 25
  year_min: 2017                  # propagation window start (post-correction)
  seed: 42
  # Anchors are SEARCH QUERIES (title + year) or "doi:..." — resolved at
  # runtime and printed for verification; never asserted citations.
  anchors:
    - [coinage_1998, "Ego depletion is the active self a limited resource", 1998]
    - [rrr_2016, "multilab preregistered replication of the ego-depletion effect", 2016]
    - [rrr_2021, "multisite preregistered paradigmatic test of the ego depletion effect", 2021]
    - [carter_2014, "publication bias and the limited strength model of self-control", 2014]
  anchors_extra:                  # 23b only
    - [hagger_2010_meta, "ego depletion and the strength model of self-control a meta-analysis", 2010]
    - [inzlicht_2012, "what is ego depletion toward a mechanistic revision of the resource model", 2012]
    - [friese_2019, "doi:10.1177/1088868318762183", null]
    - [dang_2018, "doi:10.1007/s00426-017-0862-x", null]
  coinage: coinage_1998           # the founding paper's label (23b reports its citation rate)
  correction_set: [rrr_2016, rrr_2021]                       # "either RRR"
  crisis_set: [rrr_2016, rrr_2021, carter_2014, inzlicht_2012, friese_2019, dang_2018]
  milestone_control: hagger_2010_meta
  hub_category: work/org          # venue whose non-engaged papers' references are tabulated
