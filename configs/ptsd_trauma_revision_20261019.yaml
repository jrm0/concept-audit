  queries:
    focal_ptsd: '"posttraumatic stress disorder" OR "post-traumatic stress disorder"
      OR "PTSD" OR "complex PTSD" OR "complex posttraumatic stress disorder"'
    focal_trauma: '"trauma" OR "traumatic stress" OR "psychological trauma" OR "vicarious
      trauma" OR "secondary traumatic stress" OR "collective trauma" OR "intergenerational
      trauma" OR "trauma-informed" OR "trauma informed" OR "moral injury"'
    ancestors: '"shell shock" OR "war neurosis" OR "combat neurosis" OR "traumatic
      neurosis" OR "battle fatigue" OR "combat fatigue" OR "gross stress reaction"
      OR "post-Vietnam syndrome" OR "rape trauma syndrome"'
    controls: '"acute stress disorder" OR "adjustment disorder" OR "bereavement"'
    family: TI ("posttraumatic stress disorder" OR "post-traumatic stress disorder"
      OR "PTSD" OR "complex PTSD" OR "trauma" OR "traumatic stress" OR "psychological
      trauma" OR "vicarious trauma" OR "secondary traumatic stress" OR "collective
      trauma" OR "intergenerational trauma" OR "trauma-informed" OR "trauma informed"
      OR "moral injury" OR "shell shock" OR "war neurosis" OR "combat neurosis" OR
      "traumatic neurosis" OR "battle fatigue" OR "combat fatigue" OR "gross stress
      reaction" OR "post-Vietnam syndrome" OR "rape trauma syndrome" OR "acute stress
      disorder" OR "adjustment disorder" OR "bereavement") OR AB (<same 26 terms>)
    family_health: (TI (<25 terms, no bare "trauma">) OR AB (<25 terms, no bare "trauma">))
      OR (TI ("trauma") AND (TI (psycholog* OR "mental health" OR emotional OR stress
      OR "nurses" OR "nursing") OR AB (psycholog* OR "mental health" OR emotional
      OR stress OR "nurses" OR "nursing")))
  db_codes:
    psyc: pdh,psyh
    health: cin20
    crime_socialwork: sih,cja,swh
    education: eft
    business: bth,bft
    econ: ecn
  export_limits:
    per_export: 25000
    per_day: 100000
  exclusions:
  - term: physical trauma / trauma surgery
    why: NOT excluded on purpose — the somatic sense is the origin of the creep story;
      expect a physical-injury clade in CINAHL/medicine and read it as a jingle finding,
      not noise. Revisit if it swamps the health source (>60% of kept docs).
  - term: bare 'trauma' in CINAHL, abstract-only or without psychological vocabulary
    why: 'DECIDED 2026-09-08: bare ''trauma'' TI/AB in CINAHL = 97,028, overwhelmingly
      the injury sense (trauma center, trauma patients). Health samples bare ''trauma''
      by title only where psycholog*/mental health/emotional/stress/nurs* co-occur
      (38,795). The physical sense still enters via the specific phrases and is read
      as a labeled probe. Psyc keeps the FULL union (110,040) because abstract-only
      mentions of bare ''trauma'' are the extraordinary->ordinary signal.'
  - habitat: MEDLINE / trauma surgery journals
    why: 'DECIDED 2026-09-08: not sampled. The somatic->psychic creep predates the
      1975 window; a general MEDLINE pull would flood the ''trauma'' shards with the
      injury homonym (17''s per-period cap samples from the pooled corpus). CINAHL
      carries the health habitat and keeps the homonym visible as a labeled probe.
      Revisit as a MeSH-scoped, labeled source only if a medicine-backflow question
      is asked.'
  - habitat: Historical Abstracts / humanities (memory studies, literary trauma theory)
    why: collective-trauma lineage (Caruth 1996; Alexander 2004) — leads to verify;
      not in the 13-DB budget; decide
