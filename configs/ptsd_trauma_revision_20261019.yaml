  cells:
  - id: C1b
    claim: PTSD is >= 80% of diagnostically labelled documents in 1985-89
    kind: VALIDITY
    status: OPEN
    supports: Y,L,F&R
    denominator: terms:PTSD,traumatic neurosis,war neurosis,combat neurosis,battle
      fatigue,combat fatigue,shell shock,gross stress reaction,postvietnam syndrome,rape
      trauma syndrome
    vocab: label_ptsd
    test:
      type: share_at_least
      period: 1985-1989
      value: 0.8
  - id: C1b2
    claim: and still >= 80% in 1990-94 (crossover not spread over 15 years)
    kind: VALIDITY
    status: OPEN
    supports: Y,L,F&R
    denominator: terms:PTSD,traumatic neurosis,war neurosis,combat neurosis,battle
      fatigue,combat fatigue,shell shock,gross stress reaction,postvietnam syndrome,rape
      trauma syndrome
    vocab: label_ptsd
    test:
      type: share_at_least
      period: 1990-1994
      value: 0.8
  - id: C1c
    claim: 'share of ANCESTOR-label documents that sit in psychoanalytic venues, by
      period (Young: the surviving ancestor usage is analytic)'
    kind: VALIDITY
    status: OPEN
    supports: Y
    denominator: terms:traumatic neurosis,war neurosis,combat neurosis,battle fatigue,combat
      fatigue,shell shock,gross stress reaction,postvietnam syndrome,rape trauma syndrome
    vocab: analytic_venue
    test:
      type: descriptive
  - id: C1c2
    claim: '  ...share of PTSD documents in the same analytic venues (comparison series;
      PASS for C1c = ancestor share exceeds this after 1985)'
    kind: VALIDITY
    status: OPEN
    supports: Y
    denominator: term:PTSD
    vocab: analytic_venue
    test:
      type: descriptive
  - id: C3a
    claim: veteran > abuse vocabulary among PTSD documents in 1980-84, 1985-89, 1990-94
      (Young's order)
    kind: DISCRIMINATING
    status: OPEN
    supports: Y,L
    denominator: term:PTSD
    vocab: V_veteran
    test:
      type: greater_than_other
      other: A_abuse
      periods:
      - 1980-1984
      - 1985-1989
      - 1990-1994
  - id: C3b
    claim: abuse vocabulary already >= 5% of trauma-family documents in 1970-74 and
      1975-79 (Fassin & Rechtman's order)
    kind: DISCRIMINATING
    status: OPEN
    supports: F&R
    denominator: all
    vocab: A_abuse
    test:
      type: share_at_least
      period: 1975-1979
      value: 0.05
  - id: C3b1
    claim: '  ...same test for 1970-74'
    kind: DISCRIMINATING
    status: OPEN
    supports: F&R
    denominator: all
    vocab: A_abuse
    test:
      type: share_at_least
      period: 1970-1974
      value: 0.05
  - id: C3c
    claim: 'FORECAST (Young 1995): the Vietnam share of PTSD documents falls in every
      period 1995-99 -> 2010-14'
    kind: FORECAST
    status: SEEN-direction
    supports: Y
    denominator: term:PTSD
    vocab: Vietnam
    test:
      type: monotone_decrease
      periods:
      - 1995-1999
      - 2000-2004
      - 2005-2009
