    pattern: "military|veteran|armed forces|combat|defense|defence"
  - name: nursing/health
    pattern: "nurs|health|medic|clinical|patient|hospital|emergency|surg|injur|rehabil"
  - name: psychiatry
    pattern: "psychiatr|mental health|psychopatholog"
  - name: law/forensic
    pattern: "law|legal|forensic|justice|crimin|victim|police"
  - name: social work
    pattern: "social work|social service|child welfare|family"
  - name: education
    pattern: "educat|school|teach|learn|student|academic|curricul"
  - name: work/org
    pattern: "organi[sz]ation|management|business|occupational|vocational|employ|leader|personnel|human resource"
  - name: sociology/humanities
    pattern: "sociolog|histor|cultur|memory studies|literar|anthropolog"
core_label: core/other psych

citation:
  mailto: jrmorgan3@gmail.com
  batch: 25
  year_min: 2014          # post-DSM-5 window (placeholder — decide what the "correction" is here)
  seed: 42
  # DECIDED 2026-09-08: the anchor/"correction" module (23/23b) is OPTIONAL
  # and case-specific — it was the right question for ego depletion (did the
  # RRR correction travel with the concept?), not the layer's purpose. The
  # default citation analyses for any concept are graph-level and
  # exploratory: (1) citation communities among corpus docs as structural
  # niches; (2) semantic alignment within vs between communities per
  # period; (3) inter-community flow matrix over time paired with
  # citing->cited semantic distance (readings to look for, not impose:
  # insulation / cross-pollination / backflow / absorption). Those need
  # reference lists for ALL DOI'd docs — start collecting early (quota).
  # If a message-tracking question does arise for trauma, candidate
  # critique anchors — ALL LEADS, verify before use: Haslam 2016 (Psych
  # Inquiry); Haslam & McGrath 2020 (Social Research); McNally 2003 (Annu
  # Rev Psychol) "bracket creep"; Rosen & Lilienfeld 2008 (Clin Psych Rev).
  # Left empty; 23 refuses to run without anchors.
  anchors: []
  anchors_extra: []
  coinage: null
  correction_set: []
  crisis_set: []
  milestone_control: null
  hub_category: nursing/health
  # --- Addendum A (2026-10-05): pseudo-labels for the DESCENT facet (27). Each becomes
  # a "@label" term that enters the flow / insulation machinery like any term.
  # Run 31 first: the flag groups read results/<slug>/ground_truth_doc_flags.jsonl.
  groups:
    ancestor: {terms: [traumatic neurosis, war neurosis, combat neurosis, battle fatigue, combat fatigue,
                       shell shock, gross stress reaction, postvietnam syndrome, rape trauma syndrome]}
    analytic: {venue: "psychoanal|analytic|psychoanalysis"}     # = ground_truth.venue_sets.analytic_venue
    abuse:    {flag: A_abuse}                                   # 31 vocabulary flags
    veteran:  {flag: V_veteran}
    cat:      {venue_categories: true}                          # @cat:<venue category>, the self-citation comparators (A3)

