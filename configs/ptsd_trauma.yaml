  - name: law/forensic
    pattern: "law|legal|forensic|justice|crimin|victim|police"
  - name: social work
    pattern: "social work|social service|child welfare|family"
  - name: education
    pattern: "educat|school|teach|learn|student|academic|curricul"
  - name: work/org
    pattern: "organi[sz]ation|management|business|occupational|vocational|employ|leader|personnel|human resource"
  - name: sociology/humanities
    pattern: "sociolog|histor|cultur|memory studies|literar|anthropolog"
core_label: core/other psych

citation:
