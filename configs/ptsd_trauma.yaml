# configs/ptsd_trauma.yaml — Paper 1 comparator: a FAMILY with two focal members
# predicted to move differently.
#
#   PTSD / posttraumatic stress disorder  -> predicted CONVERGENT (DSM-III 1980
#       institutionalization; Young 1995 "made real"). Test: breadth flat or
#       shrinking after 1980; unimodal periods; low excess drift.
#   trauma                                -> predicted DIVERGENT by horizontal
#       creep + niche migration (Haslam & McGrath 2020: somatic->psychic,
#       extraordinary->ordinary, direct->indirect, individual->collective;
#       Baes et al. 2023: rising breadth, falling severity in 871k psych
#       abstracts). Test: breadth up, intensity down, habitat shares shifting
#       toward nursing / education / social work; possible supported clades
#       (physical-injury vs psychological; individual vs collective).
#   backflow question (Jonathan 2026-09-08): after trauma's migration, does
#       core-psych usage move toward the applied/ordinary sense? Build the
#       applied-vs-core usage axis in the migration period, project earlier and
#       later core-psych documents onto it.
#
# STATUS (2026-09-11): RETRIEVAL IN PROGRESS. Every academic slice has been
# requested at least once; delivered files sit in ris_root under their config
# names, partials in partial/, byte-identical re-downloads in duplicates/.
# All academic slices delivered as of 2026-09-11; Crime/SocialWork at 87-88%
# (flagged on the source; re-request pending). 16 can run. Every citation-like item below is
# a LEAD to verify before it appears in text (see project rule).
#
# PRE-REGISTER the predicted cells above BEFORE running 18.

concept: posttraumatic stress disorder
slug: ptsd_trauma

family_csv: families/ptsd_trauma_family.csv
ris_root: "data/ebsco exports/ptsd_trauma"       # keep this concept's exports in their own folder
family_works_glob: null
docs_path: data/ptsd_trauma/lineage_docs.jsonl
# emb_dir names the EMBEDDING RUN. lineage_emb = 2026-09-12 run under the
# pre-Session-29 mention rules (nested compounds and "(PTSD)" counted; kept as
# the sensitivity run). lineage_emb_v2 = same corpus re-embedded under the
# rules below. results_dir follows the embedding run.
emb_dir: data/ptsd_trauma/lineage_emb_v2
citations_cache: data/citations/openalex_refs_ptsd_trauma.jsonl
results_dir: results/ptsd_trauma_v2

corpus:
  platform: EBSCOhost (BU ezproxy)
  exported: null
  # DECISION (match ego depletion for comparability, or tighten?): ego depletion
  # ran with all three expanders ON; 16 then required a family term in
  # title+abstract, which removed 16,818 records (48-69% of the two
  # PsycArticles-heavy pulls). Recommendation: expanders OFF here, TI/AB
  # fields only — the operative bound is the same either way, and it saves
  # quota. Record whichever is chosen.
  expanders: []
  fields: [TI, AB]
  limiters: [peer reviewed]
  language_filter: none
  document_type_filter: none
  queries:
    focal_ptsd: >-
      "posttraumatic stress disorder" OR "post-traumatic stress disorder" OR "PTSD"
      OR "complex PTSD" OR "complex posttraumatic stress disorder"
    focal_trauma: >-
      "trauma" OR "traumatic stress" OR "psychological trauma"
      OR "vicarious trauma" OR "secondary traumatic stress"
      OR "collective trauma" OR "intergenerational trauma"
      OR "trauma-informed" OR "trauma informed" OR "moral injury"
    ancestors: >-
      "shell shock" OR "war neurosis" OR "combat neurosis" OR "traumatic neurosis"
      OR "battle fatigue" OR "combat fatigue" OR "gross stress reaction"
      OR "post-Vietnam syndrome" OR "rape trauma syndrome"
    controls: >-
      "acute stress disorder" OR "adjustment disorder" OR "bereavement"
    # family = the union, TI/AB, run per database group like ego depletion.
    # VERBATIM as run 2026-09-08 (searchMode=any):
    family: >-
      TI ("posttraumatic stress disorder" OR "post-traumatic stress disorder" OR "PTSD" OR "complex PTSD"
      OR "trauma" OR "traumatic stress" OR "psychological trauma" OR "vicarious trauma"
      OR "secondary traumatic stress" OR "collective trauma" OR "intergenerational trauma"
      OR "trauma-informed" OR "trauma informed" OR "moral injury" OR "shell shock" OR "war neurosis"
      OR "combat neurosis" OR "traumatic neurosis" OR "battle fatigue" OR "combat fatigue"
      OR "gross stress reaction" OR "post-Vietnam syndrome" OR "rape trauma syndrome"
      OR "acute stress disorder" OR "adjustment disorder" OR "bereavement")
      OR AB (<same 26 terms>)
    # Health only: bare "trauma" admitted by TITLE and only with psychological
    # vocabulary co-occurring (searchMode=bool). Everything else as in family.
    family_health: >-
      (TI (<25 terms, no bare "trauma">) OR AB (<25 terms, no bare "trauma">))
      OR (TI ("trauma") AND (TI (psycholog* OR "mental health" OR emotional OR stress OR "nurses" OR "nursing")
      OR AB (psycholog* OR "mental health" OR emotional OR stress OR "nurses" OR "nursing")))
  # Scoping counts 2026-09-08 (peer reviewed, TI/AB, 1975-2025 unless noted):
  #   Psyc: family full union 110,040; bare "trauma" TI/AB 69,680, TI-only 22,992;
  #         PTSD 48,542; specific phrases 26,672; ancestors 538 (all dates)
  #   Health: bare "trauma" 97,028; family title-only variant 69,813; psych-scoped 38,795
  #   Crime/SW: 45,435 (title-only variant 30,916); Education 13,369; Business 2,996; Econ 182
  # Fielded (TI/AB) queries are unaffected by EBSCO expanders (identical counts on/off).
  db_codes: {psyc: "pdh,psyh", health: "cin20", crime_socialwork: "sih,cja,swh",
             education: "eft", business: "bth,bft", econ: "ecn"}
  export_limits: {per_export: 25000, per_day: 100000}
  exclusions:
    - {term: "physical trauma / trauma surgery", why: "NOT excluded on purpose — the somatic sense is the origin of the creep story; expect a physical-injury clade in CINAHL/medicine and read it as a jingle finding, not noise. Revisit if it swamps the health source (>60% of kept docs)."}
    - {term: "bare 'trauma' in CINAHL, abstract-only or without psychological vocabulary", why: "DECIDED 2026-09-08: bare 'trauma' TI/AB in CINAHL = 97,028, overwhelmingly the injury sense (trauma center, trauma patients). Health samples bare 'trauma' by title only where psycholog*/mental health/emotional/stress/nurs* co-occur (38,795). The physical sense still enters via the specific phrases and is read as a labeled probe. Psyc keeps the FULL union (110,040) because abstract-only mentions of bare 'trauma' are the extraordinary->ordinary signal."}
    - {habitat: "MEDLINE / trauma surgery journals", why: "DECIDED 2026-09-08: not sampled. The somatic->psychic creep predates the 1975 window; a general MEDLINE pull would flood the 'trauma' shards with the injury homonym (17's per-period cap samples from the pooled corpus). CINAHL carries the health habitat and keeps the homonym visible as a labeled probe. Revisit as a MeSH-scoped, labeled source only if a medicine-backflow question is asked."}
    - {habitat: "Historical Abstracts / humanities (memory studies, literary trauma theory)", why: "collective-trauma lineage (Caruth 1996; Alexander 2004) — leads to verify; not in the 13-DB budget; decide"}
  strata:
    journal: [JOUR, ABST, CONF, CASE, GEN]
    thesis: [THES]
    book: [CHAP, BOOK, EBOOK, EDBOOK]
    popular: [NEWS, MGZN, BLOG]
  sources:
    # --- home field: PsycInfo/PsycArticles in date slices (principle 2/5) ---
    # Slices sized to the 25k-per-export limit; counts = scoping 2026-09-08.
    - id: psyc_1965_1994
      files: ["data/ebsco exports/ptsd_trauma/Psyc_family_1965-1994.ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 1965-1994
      role: ancestor
      question: "parent population before and around the 1980 coinage (three pre-coinage periods)"
      n_expected: 6192
      n_records: 6150
      exported: 2026-09-09
      note: "first delivery (09-08) was partial (1,800); complete on re-request"
    - id: psyc_1995_2004
      files: ["data/ebsco exports/ptsd_trauma/Psyc_family_1995-2004.ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 1995-2004
      role: family
      question: "DSM-IV era; Criterion A broadening; complex PTSD coinage"
      n_expected: 12504
      n_records: 12489
      exported: 2026-09-08
    - id: psyc_2005_2009
      files: ["data/ebsco exports/ptsd_trauma/Psyc_family_2005-2009.ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 2005-2009
      role: family
      question: "Iraq/Afghanistan veteran literature; trauma-informed care emerges"
      n_expected: 12777
      n_records: 12691
      exported: 2026-09-08
    - id: psyc_2010_2014
      files: ["data/ebsco exports/ptsd_trauma/Psyc_family_2010-2014.ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 2010-2014
      role: family
      question: "pre-/at DSM-5"
      n_expected: 18531
      n_records: 18462
      exported: 2026-09-08
    - id: psyc_2015_2019
      # Delivered PARTIAL twice (10,802 then 2,452 of 22,985; overlapping heads of the
      # relevance-ranked list, not random samples) -> re-requested as SINGLE-YEAR slices.
      files: ["data/ebsco exports/ptsd_trauma/Psyc_family_2015-2019.ris",
              "data/ebsco exports/ptsd_trauma/Psyc_family_201[5-9].ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 2015-2019
      role: family
      question: "DSM-5 era; ICD-11 complex PTSD; peak creep period per Haslam"
      n_expected: 22985          # single-year page counts 2026-09-09: 4,371 / 4,376 / 4,534 / 4,664 / 5,040
      n_records: 22849           # delivered 4,334 / 4,350 / 4,523 / 4,652 / 4,990 (99.4%)
      exported: 2026-09-09
    - id: psyc_2020_2022
      # First delivery partial (2,489 of 18,367) -> single-year slices.
      files: ["data/ebsco exports/ptsd_trauma/Psyc_family_2020-2022.ris",
              "data/ebsco exports/ptsd_trauma/Psyc_family_202[0-2].ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 2020-2022
      role: family
      question: "pandemic era"
      n_expected: 18367          # single-year page counts: 5,596 / 6,169 / 6,602
      n_records: 18322           # delivered 5,581 / 6,154 / 6,587 (99.8%)
      exported: 2026-09-09
    - id: psyc_2023_2025
      # Requested as single-year slices from the start (partial-delivery lesson).
      files: ["data/ebsco exports/ptsd_trauma/Psyc_family_2023-2025.ris",
              "data/ebsco exports/ptsd_trauma/Psyc_family_202[3-5].ris"]
      databases: [APA PsycInfo, APA PsycArticles]
      query: family
      dates: 2023-2025
      role: family
      question: "most recent usage"
      n_expected: 19057          # single-year page counts: 6,742 / 6,014 / 6,301
      n_records: 19004           # 2023: 6,726 (re-request 09-11, 99.8%), 2024: 5,994, 2025: 6,284; first 2023 delivery (842) in partial/
      exported: 2026-09-11
    # --- habitats by hypothesis (Haslam & McGrath's four directions) ---
    - id: health
      files: ["data/ebsco exports/ptsd_trauma/health_family_*.ris"]
      databases: [CINAHL]
      query: family_health
      dates: "1975-2014 (12,648) / 2015-2019 (9,487) / 2020-2022 (8,401) / 2023-2025 (8,260)"
      role: habitat
      hypothesis: "direct->indirect (vicarious/secondary trauma in nursing); the somatic homonym enters only via specific phrases — see exclusions"
      n_expected: 38795
      n_records: 38796           # 1975-2014: 12,648; 2015-2019: 9,487; 2020-2022: 8,401; 2023-2025: 8,260 (all 100%); first 2020-2025 delivery (8,812) in partial/
      exported: 2026-09-11
    - id: crime_socialwork
      files: ["data/ebsco exports/ptsd_trauma/crime-socialwork_family_*.ris"]
      databases: [SocINDEX with Full Text, Criminal Justice Abstracts, Social Work Abstracts]
      query: family
      dates: "1975-2014 (22,483) / 2015-2025 (22,952)"
      role: habitat
      hypothesis: "individual->collective (sociology); trauma-informed practice (social work); victim/forensic use (criminal justice)"
      n_expected: 45435          # page counts 2026-09-11: 22,483 + 22,952 (= sum of per-DB counts: sih 15,702 + cja 5,491 + swh 1,290 for 1975-2014; exports do NOT dedupe across DBs)
      n_records: 39856           # 19,611 (87.2%) + 20,245 (88.2%) — SHORT by ~12% in both slices, SocINDEX shortest (84%). Not the truncated-head signature (12-53%, one DB dominant); cause unknown. KEPT for the audit; RE-REQUEST both next window and compare (16 dedupes across files, so a union is safe).
      exported: 2026-09-11
      delivery_flag: "87-88% of page count; see note; re-request pending"
    - id: education
      files: ["data/ebsco exports/ptsd_trauma/education_family.ris"]
      databases: ["Education Full Text (H.W. Wilson)"]
      query: family
      dates: 1975-2025
      role: habitat
      hypothesis: "extraordinary->ordinary: trauma-informed schools; ACEs discourse"
      n_expected: 19663          # full union on the results page 2026-09-11 (13,369 was the title-only scoping count)
      n_records: 19663           # 100%
      exported: 2026-09-11
    - id: business
      files: ["data/ebsco exports/ptsd_trauma/Business_family.ris"]
      databases: [Business Source Complete, "Business Abstracts with Full Text (H.W. Wilson)"]
      query: family
      dates: 1975-2025
      role: habitat
      hypothesis: "extraordinary->ordinary: workplace trauma, trauma-informed leadership; also the SURPRISE BUDGET — same DB as ego depletion's migration niche, for comparability"
      n_expected: 5124           # full union on the results page 2026-09-11 (2,996 was the title-only scoping count)
      n_records: 5087            # 99.3%
      exported: 2026-09-11
    - id: econ
      files: ["data/ebsco exports/ptsd_trauma/econ_family.ris"]
      databases: [EconLit]
      query: family
      dates: 1975-2025
      role: habitat
      hypothesis: "surprise budget only (economics of veterans' disability, conflict) — expected small"
      n_expected: 335            # full union on the results page (182 was the title-only scoping count)
      n_records: 335             # 100%; earliest record 1987
      exported: 2026-09-11
    # --- popular stratum (principle 7: separate register; planned from the start) ---
    - id: popular_news
      files: ["data/ptsd_trauma/popular/news_*.jsonl"]
      databases: ["TBD: ProQuest TDM Studio newspapers (BU access noted Session 6) or NYT API"]
      query: focal_ptsd OR focal_trauma
      dates: 1975-2025
      role: popular
      stratum: popular
      hypothesis: "horizontal creep into lay usage — invisible in academic abstracts; Haslam 2016 used Google Books frequency; a 2025 NYT-corpus study reported severity for depression (lead — verify)"
      n_records: null
      note: "different register and embedding behaviour; NEVER pooled with journal stratum; analysed as its own lineage with the same controls"
    - id: popular_books_ngram
      files: ["data/ptsd_trauma/popular/ngram_*.csv"]
      databases: ["Google Books Ngram (frequency only; no contexts)"]
      query: "trauma; PTSD; posttraumatic stress disorder; shell shock"
      dates: 1900-2019
      role: popular
      stratum: popular
      hypothesis: "salience curve only — the lead/lag test (salience -> breadth, Vylomova & Haslam) needs it"
      n_records: null
  ignore:
    - {files: "data/ebsco exports/ptsd_trauma/partial/**", why: "PARTIAL deliveries from the EBSCO email export, kept for the record, never ingested. 09-08: 1965-94 1,800/6,192; 2015-19 10,802/22,985; 2020-22 2,489/18,367. 09-09 re-request of 2015-19: 2,452 (83% overlapping the first fragment -> truncated heads of the relevance-ranked list, NOT random samples; biased toward high-mention records; first fragment also had ~13% within-file duplicates). 09-09 PM batch: Psyc 2023 842/6,742 and Health 2020-25 8,812/16,660 partial. Mitigation: single-year slices, requests spaced a few minutes apart, every delivery checked against expected n before renaming."}
    - {files: "data/ebsco exports/ptsd_trauma/duplicates/**", why: "byte-identical re-downloads of files already in place (md5-checked 2026-09-09); safe to delete"}
  audit:
    min_abstract_share: 0.85
    warn_if_dedupe_share_above: 0.45

periods:
  year_min: 1965          # three pre-coinage periods for PTSD (DSM-III 1980)
  year_max: 2025
  width: 5

control_terms: [participants, results, significant, measure]   # keep identical across concepts

# Which occurrences count as mentions (pipeline_config.valid_spans; Session 29).
# Both false = pre-Session-29 behaviour (the lineage_emb run).
mentions:
  exclude_nested: true                 # "trauma" inside "trauma-informed" counts for the compound only
  strip_acronym_parentheticals: true   # "posttraumatic stress disorder (PTSD)" -> "(PTSD)" removed from the context
  exclude_hyphen_prefixed: true        # "post-traumatic stress symptoms" is not a mention of "traumatic stress"

embedding:
  model: allenai/scibert_scivocab_uncased
  max_length: 256
  max_sent_per_doc: 3
  cap_per_term_period: null   # embed every document; equalize at analysis time
  control_cap: 300
  seed: 42

analysis:
  syntax_flag_diff: 0.5      # 18's syntax guard: flag a supported split whose clusters differ by more than this on any syntax-feature rate
  min_n: 15
  cluster_min_n: 60
  max_k: 4
  n_sample_titles: 10
  seed: 42
  equalize_n: 250
  equalize_reps: 100

# Institutional events (dates are well known but VERIFY against APA/WHO records before print)
events:
  1980: "DSM-III: PTSD enters the nosology"
  1987: "DSM-III-R revision"
  1994: "DSM-IV: Criterion A broadened (indirect exposure); acute stress disorder added"
  2013: "DSM-5: moved to trauma- and stressor-related disorders; Criterion A revised"
  2018: "ICD-11: complex PTSD recognized"
event_short_labels:
  1980: DSM-III
  1987: DSM-III-R
  1994: DSM-IV
  2013: DSM-5
  2018: ICD-11

key_pairs:
  - [posttraumatic stress disorder, trauma]
  - [posttraumatic stress disorder, ptsd]
  - [posttraumatic stress disorder, traumatic stress]
  - [posttraumatic stress disorder, acute stress disorder]
  - [trauma, traumatic stress]
  - [trauma, vicarious trauma]
  - [trauma, collective trauma]
  - [trauma, trauma informed]
  - [posttraumatic stress disorder, shell shock]
  - [posttraumatic stress disorder, complex ptsd]

figures:
  trajectory_terms: [posttraumatic stress disorder, ptsd, trauma, traumatic stress,
                     complex ptsd, vicarious trauma, trauma informed, acute stress disorder]
  trajectory_min_docs: 60
  drift_terms:
    - [trauma, crimson]
    - [posttraumatic stress disorder, navy]
    - [ptsd, "0.45"]
    - [traumatic stress, "0.6"]
  distance_pairs:
    - [posttraumatic stress disorder, trauma, navy]
    - [trauma, vicarious trauma, darkorange]
    - [trauma, trauma informed, seagreen]
    - [posttraumatic stress disorder, acute stress disorder, crimson]
  migration_baseline_category: nursing/health
  annotations: {}      # filled AFTER results exist; never before

venue_categories:
